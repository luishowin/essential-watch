<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch OS Emulator v1.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bezel-color: #1a1a1a;
            --screen-bg: #000000;
            --oled-on: #33E5FF;
            --oled-dim: #114c55;
            --case-metal: #2d2d2d;
            --feedback-color: #ff3333; /* Red for debug indicators */
        }

        body {
            background-color: #e0e0e0;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .watch-case {
            position: relative;
            padding: 20px 20px;
            background-color: var(--bezel-color);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid var(--case-metal);
            box-shadow: 
                inset 0 0 10px #000,
                15px 15px 25px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: var(--screen-bg);
            image-rendering: pixelated;
            width: 128px;
            height: 64px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8); 
        }

        .screen-overlay {
            position: absolute;
            top: 20px; left: 20px;
            width: 128px;
            height: 64px;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 2px;
            opacity: 0.6;
        }

        /* --- VISUAL AIDS (EMULATOR ONLY) --- */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .fb-icon {
            position: absolute;
            color: var(--feedback-color);
            font-weight: bold;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.05s; /* Fast transition for responsiveness */
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
        }
        .fb-visible { opacity: 1; }
        
        /* Positioning indicators near physical buttons */
        #fb-btn1 { right: -35px; top: 10px; }
        #fb-btn2 { right: -35px; bottom: 10px; }
        #fb-crown-up { right: -35px; top: 35%; font-size: 14px; }
        #fb-crown-down { right: -35px; bottom: 35%; font-size: 14px; }
        #fb-crown-press { right: -50px; top: 45%; font-size: 12px; }


        .controls-hint {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }
        .key {
            display: inline-block;
            background: #ddd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #bbb;
            color: #000;
        }

        .btn-physical {
            position: absolute;
            background: var(--case-metal);
            border: 1px solid #111;
            transition: transform 0.1s;
        }
        .crown { right: -10px; top: 50%; transform: translateY(-50%); width: 8px; height: 20px; border-radius: 0 2px 2px 0; background: repeating-linear-gradient(0deg, #333, #333 2px, #555 3px); }
        .btn1 { right: -6px; top: 15px; width: 6px; height: 15px; border-radius: 0 2px 2px 0; }
        .btn2 { right: -6px; bottom: 15px; width: 6px; height: 15px; border-radius: 0 2px 2px 0; }
        .active-btn { filter: brightness(1.5); }
    </style>
</head>
<body>

    <div class="watch-case">
        <div id="phy-btn1" class="btn-physical btn1"></div>
        <div id="phy-crown" class="btn-physical crown"></div>
        <div id="phy-btn2" class="btn-physical btn2"></div>
        
        <canvas id="display" width="128" height="64"></canvas>
        <div class="screen-overlay"></div>
        
        <!-- Input Feedback Layer (Outside UI) -->
        <div class="feedback-overlay">
            <div id="fb-btn1" class="fb-icon">&lt;</div>
            <div id="fb-btn2" class="fb-icon">&lt;</div>
            <div id="fb-crown-up" class="fb-icon">▲</div>
            <div id="fb-crown-down" class="fb-icon">▼</div>
            <div id="fb-crown-press" class="fb-icon">[OK]</div>
        </div>
    </div>

    <div class="controls-hint">
        <p><span class="key">↑/↓</span> Rotate &nbsp;|&nbsp; <span class="key">Enter</span> Press</p>
        <p><span class="key">Z</span> Btn 1 (Select) &nbsp;|&nbsp; <span class="key">X</span> Btn 2 (Back)</p>
    </div>

<script>
/**
 * WATCH OS v1.1
 * Resolution: 128x64
 */

// --- CONSTANTS ---
const SCREEN_W = 128;
const SCREEN_H = 64;
const FPS = 30;
const COLOR_ON = "#33E5FF";
const COLOR_OFF = "#000000";
const COLOR_DIM = "#114c55";

// --- CORE SYSTEM ---

class AudioController {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.volume = 0.15;
    }
    playTone(freq, type, duration) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }
    beep() { this.playTone(1500, 'square', 0.05); } 
    chime() { this.playTone(1800, 'sine', 0.1); setTimeout(()=>this.playTone(2200, 'sine', 0.2), 100); }
    alarm() { 
        this.playTone(1500, 'sawtooth', 0.2); 
        setTimeout(() => this.playTone(1500, 'sawtooth', 0.2), 300);
    }
}

class SimulatedSensors {
    constructor() {
        this.heartRate = 142;
        this.battery = 84;
        this.gpsLocked = true;
        this.heading = 0;
        setInterval(() => {
            this.heartRate = 138 + Math.floor(Math.random() * 8);
            this.heading = (this.heading + 5) % 360;
        }, 1000);
    }
}

class Graphics {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;
    }
    clear() {
        this.ctx.fillStyle = COLOR_OFF;
        this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    }
    text(str, x, y, size = 12, align = "left", color = COLOR_ON) {
        this.ctx.font = `700 ${size}px 'Doto', monospace`; 
        this.ctx.fillStyle = color;
        this.ctx.textAlign = align;
        this.ctx.fillText(str, x, y);
    }
    rect(x, y, w, h, filled = true) {
        this.ctx.strokeStyle = COLOR_ON;
        this.ctx.fillStyle = COLOR_ON;
        if (filled) this.ctx.fillRect(x, y, w, h);
        else this.ctx.strokeRect(x, y, w, h);
    }
    line(x1, y1, x2, y2) {
        this.ctx.strokeStyle = COLOR_ON;
        this.ctx.beginPath();
        this.ctx.moveTo(x1, y1);
        this.ctx.lineTo(x2, y2);
        this.ctx.stroke();
    }
}

// --- VISUAL FEEDBACK (DOM BASED) ---
class InputFeedback {
    constructor() {
        this.timers = {};
    }
    
    // Set state directly for key up/down events
    setState(id, visible) {
        const el = document.getElementById(id);
        if(!el) return;
        if (visible) el.classList.add('fb-visible');
        else el.classList.remove('fb-visible');
    }

    // Flash for stateless events (Rotation)
    flash(id) {
        this.setState(id, true);
        if(this.timers[id]) clearTimeout(this.timers[id]);
        this.timers[id] = setTimeout(() => this.setState(id, false), 200);
    }
}

class Mode {
    constructor(os) { this.os = os; }
    enter() {} 
    exit() {}
    update(dt) {}
    draw(gfx) {}
    onInput(event, type) {}
}

// --- IMPLEMENTED MODES ---

class HomeMode extends Mode {
    draw(gfx) {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit' });
        const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

        gfx.text(timeStr, SCREEN_W/2, 30, 24, "center", COLOR_ON); 
        gfx.text(dateStr, SCREEN_W/2, 50, 14, "center", COLOR_ON);
    }
    onInput(e, type) {
        if (type === 'long_press' && e === 'ENTER') this.os.switchMode('menu');
    }
}

class MenuMode extends Mode {
    constructor(os) {
        super(os);
        this.items = ["Stopwatch", "Timer", "Alarms", "Workout", "Compass", "Info", "Exit"];
        this.selected = 0;
    }
    draw(gfx) {
        const startY = 22;
        const h = 16; 
        const windowSize = 3;
        
        let startIdx = 0;
        if (this.selected >= windowSize) startIdx = this.selected - windowSize + 1;

        for (let i = 0; i < windowSize; i++) {
            const itemIdx = startIdx + i;
            if (itemIdx >= this.items.length) break;
            const item = this.items[itemIdx];
            const y = startY + (i * h);
            const isSel = itemIdx === this.selected;
            
            if (isSel) gfx.text(">", 8, y, 14, "left", COLOR_ON);
            gfx.text(item, 20, y, 14, "left", isSel ? COLOR_ON : COLOR_DIM);
        }
    }
    onInput(e, type) {
        if (type === 'rotate') {
            if (e === 'DOWN') this.selected = (this.selected + 1) % this.items.length;
            if (e === 'UP') this.selected = (this.selected - 1 + this.items.length) % this.items.length;
        }
        if (type === 'click' && e === 'ENTER') {
            const map = { 
                "Exit": "home", "Stopwatch": "stopwatch", "Workout": "workout", 
                "Compass": "compass", "Info": "info", "Timer": "timer", "Alarms": "alarms" 
            };
            if(map[this.items[this.selected]]) this.os.switchMode(map[this.items[this.selected]]);
        }
        if (e === 'BTN2') this.os.switchMode('home');
    }
}

class TimerMode extends Mode {
    constructor(os) {
        super(os);
        this.state = 'SET'; // SET, RUNNING, PAUSED, DONE
        this.editField = 0; // 0=H, 1=M, 2=S
        this.h = 0; this.m = 5; this.s = 0;
        this.timeLeft = 0;
    }

    enter() { 
        this.state = 'SET'; 
        this.editField = 1; 
    }

    update(dt) {
        if(this.state === 'RUNNING') {
            this.timeLeft -= dt;
            if(this.timeLeft <= 0) {
                this.timeLeft = 0;
                this.state = 'DONE';
                this.os.audio.chime();
            }
        }
    }

    draw(gfx) {
        if(this.state === 'SET') {
            gfx.text("SET TIMER", SCREEN_W/2, 14, 12, "center", COLOR_DIM);
            const timeStr = `${this.h}:${this.m.toString().padStart(2,'0')}:${this.s.toString().padStart(2,'0')}`;
            
            let xOffset = 30;
            if(this.editField === 0) gfx.rect(xOffset-2, 28, 14, 2, true);
            if(this.editField === 1) gfx.rect(xOffset+20, 28, 20, 2, true);
            if(this.editField === 2) gfx.rect(xOffset+50, 28, 20, 2, true);
            
            gfx.text(timeStr, SCREEN_W/2, 40, 20, "center", COLOR_ON);
            gfx.text("[^] Change  [Ent] Next", SCREEN_W/2, 60, 10, "center", COLOR_DIM);
        } else {
            const totalS = Math.ceil(this.timeLeft / 1000);
            const h = Math.floor(totalS / 3600);
            const m = Math.floor((totalS % 3600) / 60);
            const s = totalS % 60;
            const str = `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            
            gfx.text(this.state, SCREEN_W/2, 14, 12, "center", this.state==='DONE' ? "#fff" : COLOR_DIM);
            gfx.text(str, SCREEN_W/2, 40, 24, "center", COLOR_ON);
            if(this.state !== 'DONE') gfx.text("[Z] Start/Stop", SCREEN_W/2, 60, 10, "center", COLOR_DIM);
        }
    }

    onInput(e, type) {
        if(this.state === 'SET') {
            if(type === 'rotate') {
                const dir = (e==='UP') ? 1 : -1;
                if(this.editField === 0) this.h = Math.max(0, Math.min(23, this.h + dir));
                if(this.editField === 1) this.m = Math.max(0, Math.min(59, this.m + dir));
                if(this.editField === 2) this.s = Math.max(0, Math.min(59, this.s + dir));
            }
            if(type === 'click' && e === 'ENTER') {
                this.editField++;
                if(this.editField > 2) {
                    this.timeLeft = ((this.h*3600) + (this.m*60) + this.s) * 1000;
                    this.state = 'PAUSED';
                }
            }
        } else {
            if(e === 'BTN1' && type === 'click') {
                if(this.state === 'PAUSED') this.state = 'RUNNING';
                else if(this.state === 'RUNNING') this.state = 'PAUSED';
            }
            if(e === 'BTN2' && type === 'click') {
                this.state = 'SET'; 
                this.editField = 0;
            }
        }
        if(e === 'BTN2' && this.state === 'SET') this.os.switchMode('menu');
    }
}

class AlarmMode extends Mode {
    constructor(os) {
        super(os);
        this.alarms = [
            { h: 7, m: 0, on: false },
            { h: 8, m: 30, on: false },
            { h: 18, m: 0, on: true }
        ];
        this.state = 'LIST'; 
        this.selIdx = 0;
    }

    draw(gfx) {
        if(this.state === 'LIST') {
            gfx.text("ALARMS", SCREEN_W/2, 12, 12, "center", COLOR_DIM);
            this.alarms.forEach((a, i) => {
                const y = 28 + (i * 12);
                const prefix = i === this.selIdx ? ">" : " ";
                const status = a.on ? "ON" : "--";
                gfx.text(`${prefix} ${a.h.toString().padStart(2,'0')}:${a.m.toString().padStart(2,'0')} ${status}`, 10, y, 12);
            });
        } else {
            gfx.text(`EDIT ALARM ${this.selIdx+1}`, SCREEN_W/2, 14, 12, "center", COLOR_DIM);
            const a = this.alarms[this.selIdx];
            const str = `${a.h.toString().padStart(2,'0')}:${a.m.toString().padStart(2,'0')}`;
            
            if(this.state === 'EDIT_H') gfx.rect(35, 30, 20, 2, true);
            else gfx.rect(65, 30, 20, 2, true);

            gfx.text(str, SCREEN_W/2, 45, 24, "center");
        }
    }

    onInput(e, type) {
        if(this.state === 'LIST') {
            if(type === 'rotate') {
                if(e === 'DOWN') this.selIdx = (this.selIdx + 1) % 3;
                if(e === 'UP') this.selIdx = (this.selIdx - 1 + 3) % 3;
            }
            if(e === 'BTN1') {
                this.alarms[this.selIdx].on = !this.alarms[this.selIdx].on;
            }
            if(e === 'ENTER' && type === 'click') {
                this.state = 'EDIT_H';
            }
            if(e === 'BTN2') this.os.switchMode('menu');
        } else {
            const a = this.alarms[this.selIdx];
            if(type === 'rotate') {
                const dir = (e==='UP') ? 1 : -1;
                if(this.state === 'EDIT_H') a.h = (a.h + dir + 24) % 24;
                if(this.state === 'EDIT_M') a.m = (a.m + dir + 60) % 60;
            }
            if(type === 'click' && e === 'ENTER') {
                if(this.state === 'EDIT_H') this.state = 'EDIT_M';
                else this.state = 'LIST';
            }
            if(e === 'BTN2') this.state = 'LIST';
        }
    }
}

class WorkoutMode extends Mode {
    constructor(os) { super(os); this.dist=0; }
    update(dt) { this.dist += 0.001; }
    draw(gfx) {
        gfx.text("PACE  5:21", 5, 25, 18, "left", COLOR_ON);
        gfx.text(`HR    ${this.os.sensors.heartRate}`, 5, 45, 18, "left", COLOR_ON);
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

class StopwatchMode extends Mode {
    constructor(os) { super(os); this.t=0; this.run=false; }
    update(dt) { if(this.run) this.t += dt; }
    draw(gfx) {
        gfx.text("STOPWATCH", SCREEN_W/2, 14, 12, "center", COLOR_DIM);
        gfx.text((this.t/1000).toFixed(2), SCREEN_W/2, 40, 24, "center");
        gfx.text(this.run?"STOP":"START", 10, 60, 10);
        gfx.text("RESET", SCREEN_W-10, 60, 10, "right");
    }
    onInput(e, type) {
        // Correctly handle long_press exit for BTN2
        if(type === 'long_press' && e === 'BTN2') {
            this.os.switchMode('home');
            return;
        }

        if(type === 'click') {
            if(e==='BTN1') this.run = !this.run;
            if(e==='BTN2') { this.run=false; this.t=0; }
        }
    }
}

class InfoMode extends Mode {
    draw(gfx) {
        gfx.text("INFO v1.1", SCREEN_W/2, 20, 14, "center");
        gfx.text("BAT: 84%", SCREEN_W/2, 35, 14, "center");
        gfx.text("MEM: 64KB", SCREEN_W/2, 50, 14, "center");
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

class CompassMode extends Mode {
    draw(gfx) {
        const h = this.os.sensors.heading;
        gfx.text("COMPASS", SCREEN_W/2, 20, 14, "center");
        gfx.text(`${Math.floor(h)}°`, SCREEN_W/2, 45, 24, "center");
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

// --- OS KERNEL ---

class WatchOS {
    constructor() {
        this.gfx = new Graphics('display');
        this.audio = new AudioController();
        this.sensors = new SimulatedSensors();
        this.feedback = new InputFeedback();
        
        this.modes = {
            home: new HomeMode(this),
            menu: new MenuMode(this),
            stopwatch: new StopwatchMode(this),
            workout: new WorkoutMode(this),
            info: new InfoMode(this),
            compass: new CompassMode(this),
            timer: new TimerMode(this),
            alarms: new AlarmMode(this)
        };
        this.currentMode = this.modes.home;
        this.inputState = { pressedKey: null, lastPressTime: 0 };
        this.initInput();
        this.loop();
    }

    switchMode(name) {
        if(this.modes[name]) {
            this.currentMode.exit();
            this.currentMode = this.modes[name];
            this.currentMode.enter();
            this.audio.beep();
        }
    }

    handleInput(key, action) {
        const now = Date.now();
        this.triggerAnim(key);

        // Feedback: Show on Down/Rotate, Hide on Up
        const fbMap = { 
            'BTN1': 'fb-btn1', 'BTN2': 'fb-btn2', 'ENTER': 'fb-crown-press',
            'UP': 'fb-crown-up', 'DOWN': 'fb-crown-down'
        };

        if (action === 'down' && fbMap[key]) {
            this.feedback.setState(fbMap[key], true);
        } else if (action === 'up' && fbMap[key]) {
            this.feedback.setState(fbMap[key], false);
        } else if (action === 'rotate') {
            this.feedback.flash(fbMap[key]);
        }

        if (action === 'down') {
            this.inputState.pressedKey = key;
            this.inputState.lastPressTime = now;
            
            // Allow LONG PRESS for ALL buttons (BTN1, BTN2, ENTER)
            if (['ENTER', 'BTN1', 'BTN2'].includes(key)) {
                 this.holdTimer = setTimeout(() => {
                     this.currentMode.onInput(key, 'long_press');
                     this.inputState.pressedKey = null; // Consume event
                 }, 500); // 500ms hold time
            }
        } else if (action === 'up') {
            clearTimeout(this.holdTimer);
            if (this.inputState.pressedKey === key) {
                this.currentMode.onInput(key, 'click');
            }
            this.inputState.pressedKey = null;
        } else if (action === 'rotate') {
            this.currentMode.onInput(key, 'rotate');
        }
    }

    triggerAnim(key) {
        const map = { 'Z': 'phy-btn1', 'X': 'phy-btn2', 'UP': 'phy-crown', 'DOWN': 'phy-crown', 'ENTER': 'phy-crown' };
        const el = document.getElementById(map[key]);
        if(el) {
            el.classList.add('active-btn');
            setTimeout(() => el.classList.remove('active-btn'), 100);
        }
    }

    initInput() {
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const map = { 'ArrowUp':'UP', 'ArrowDown':'DOWN', 'Enter':'ENTER', 'z':'BTN1', 'x':'BTN2', 'Z':'BTN1', 'X':'BTN2' };
            if (map[e.key]) this.handleInput(map[e.key], e.key.includes('Arrow') ? 'rotate' : 'down');
        });
        document.addEventListener('keyup', (e) => {
            const map = { 'Enter':'ENTER', 'z':'BTN1', 'x':'BTN2', 'Z':'BTN1', 'X':'BTN2' };
            if (map[e.key]) this.handleInput(map[e.key], 'up');
        });
    }

    loop() {
        this.currentMode.update(1000/FPS);
        this.gfx.clear();
        this.currentMode.draw(this.gfx);
        requestAnimationFrame(() => this.loop());
    }
}

window.onload = () => new WatchOS();
</script>
</body>
</html>
