<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueSteel OS Emulator v0.3</title>
    <!-- Importing a Dot Matrix style font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bezel-color: #1a1a1a;
            --screen-bg: #000000;
            --oled-on: #33E5FF;
            --oled-dim: #114c55;
            --case-metal: #2d2d2d;
        }

        body {
            background-color: #e0e0e0;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* The Watch Case - Rectangular & Compact */
        .watch-case {
            position: relative;
            padding: 20px 20px; /* Bezel thickness */
            background-color: var(--bezel-color);
            border-radius: 6px; /* Slightly rounded corners */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid var(--case-metal);
            
            /* Shadow Bottom Right */
            box-shadow: 
                inset 0 0 10px #000,
                15px 15px 25px rgba(0,0,0,0.5);
        }

        /* The Screen - 1:1 Scale (True 128x64) */
        canvas {
            background-color: var(--screen-bg);
            image-rendering: pixelated;
            width: 128px;
            height: 64px;
            /* No border-radius for the screen itself, raw pixels */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8); 
        }

        .screen-overlay {
            position: absolute;
            top: 20px; left: 20px; /* Match padding */
            width: 128px;
            height: 64px;
            pointer-events: none;
            /* Scanlines */
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 2px;
            opacity: 0.6;
        }

        .controls-hint {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }
        .key {
            display: inline-block;
            background: #ddd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #bbb;
            color: #000;
        }

        /* Controls */
        .btn-physical {
            position: absolute;
            background: var(--case-metal);
            border: 1px solid #111;
            transition: transform 0.1s;
        }
        
        .crown {
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 20px;
            border-radius: 0 2px 2px 0;
            background: repeating-linear-gradient(0deg, #333, #333 2px, #555 3px);
        }
        .btn1 { 
            right: -6px; 
            top: 15px; 
            width: 6px; 
            height: 15px; 
            border-radius: 0 2px 2px 0;
        }
        .btn2 { 
            right: -6px; 
            bottom: 15px; 
            width: 6px; 
            height: 15px; 
            border-radius: 0 2px 2px 0;
        }

        .active-btn { filter: brightness(1.5); }
    </style>
</head>
<body>

    <div class="watch-case">
        <div id="phy-btn1" class="btn-physical btn1"></div>
        <div id="phy-crown" class="btn-physical crown"></div>
        <div id="phy-btn2" class="btn-physical btn2"></div>
        
        <!-- 128x64 Resolution -->
        <canvas id="display" width="128" height="64"></canvas>
        <div class="screen-overlay"></div>
    </div>

    <div class="controls-hint">
        <p><span class="key">↑/↓</span> Crown Rotate &nbsp;|&nbsp; <span class="key">Enter</span> Crown Press</p>
        <p><span class="key">Z</span> Btn 1 (Select) &nbsp;|&nbsp; <span class="key">X</span> Btn 2 (Back)</p>
    </div>

<script>
/**
 * BLUESTEEL OS v0.3 - PROTOTYPE EDITION
 * Resolution: 128x64 (1:1 Scale)
 * Font: Dot Matrix (VT323)
 */

// --- CONSTANTS & CONFIG ---
const SCREEN_W = 128;
const SCREEN_H = 64;
const FPS = 30;
const COLOR_ON = "#33E5FF";
const COLOR_OFF = "#000000";
const COLOR_DIM = "#114c55";

// --- CORE SYSTEM ---

class AudioController {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.volume = 0.1;
    }
    playTone(freq, type, duration) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }
    beep() { this.playTone(800, 'square', 0.05); }
    chime() { this.playTone(1200, 'sine', 0.2); }
}

class SimulatedSensors {
    constructor() {
        this.heartRate = 142;
        this.battery = 84;
        this.gpsLocked = true;
        this.heading = 0;
        setInterval(() => {
            this.heartRate = 138 + Math.floor(Math.random() * 8);
            this.heading = (this.heading + 5) % 360;
        }, 1000);
    }
}

class FileSystem {
    save(filename, content) {
        console.log(`[FS] Saving ${filename}...`);
    }
}

class Graphics {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;
    }
    clear() {
        this.ctx.fillStyle = COLOR_OFF;
        this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    }
    // Updated font stack for dot matrix look
    text(str, x, y, size = 16, align = "left", color = COLOR_ON) {
        this.ctx.font = `${size}px 'VT323', monospace`; 
        this.ctx.fillStyle = color;
        this.ctx.textAlign = align;
        // Adjust Y slightly because custom fonts render differently than system mono
        this.ctx.fillText(str, x, y);
    }
    rect(x, y, w, h, filled = true) {
        this.ctx.strokeStyle = COLOR_ON;
        this.ctx.fillStyle = COLOR_ON;
        if (filled) this.ctx.fillRect(x, y, w, h);
        else this.ctx.strokeRect(x, y, w, h);
    }
    line(x1, y1, x2, y2) {
        this.ctx.strokeStyle = COLOR_ON;
        this.ctx.beginPath();
        this.ctx.moveTo(x1, y1);
        this.ctx.lineTo(x2, y2);
        this.ctx.stroke();
    }
}

class Mode {
    constructor(os) { this.os = os; }
    enter() {} 
    exit() {}
    update(dt) {}
    draw(gfx) {}
    onInput(event, type) {}
}

// --- MODES IMPLEMENTATION ---

class HomeMode extends Mode {
    draw(gfx) {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit' });
        const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

        // +------------------------------+
        // |        12:45 PM              |
        // |      Tue 21 Nov 2025         |
        // +------------------------------+

        gfx.text(timeStr, SCREEN_W/2, 30, 26, "center", COLOR_ON);
        gfx.text(dateStr, SCREEN_W/2, 50, 16, "center", COLOR_ON);
    }
    onInput(e, type) {
        if (type === 'long_press' && e === 'ENTER') this.os.switchMode('menu');
    }
}

class MenuMode extends Mode {
    constructor(os) {
        super(os);
        this.items = ["Stopwatch", "Alarms", "Workout", "Compass", "Info", "Exit"];
        this.selected = 0;
    }
    draw(gfx) {
        // +------------------------------+
        // | > Stopwatch                  |
        // |    Alarms                    |
        // +------------------------------+
        
        const startY = 25; // Start drawing text here
        const h = 20; // Line height
        
        // Viewport window logic (show 3 items max)
        const windowSize = 3;
        let startIdx = 0;
        if (this.selected >= windowSize) {
            startIdx = this.selected - windowSize + 1;
        }

        for (let i = 0; i < windowSize; i++) {
            const itemIdx = startIdx + i;
            if (itemIdx >= this.items.length) break;

            const item = this.items[itemIdx];
            const y = startY + (i * h);
            const isSel = itemIdx === this.selected;
            
            if (isSel) {
                gfx.text(">", 10, y, 20, "left", COLOR_ON);
            }
            gfx.text(item, 25, y, 20, "left", isSel ? COLOR_ON : COLOR_DIM);
        }
    }
    onInput(e, type) {
        if (type === 'rotate') {
            if (e === 'DOWN') this.selected = (this.selected + 1) % this.items.length;
            if (e === 'UP') this.selected = (this.selected - 1 + this.items.length) % this.items.length;
        }
        if (type === 'click' && e === 'ENTER') {
            const map = { "Exit": "home", "Stopwatch": "stopwatch", "Workout": "workout", "Compass": "compass", "Info": "info" };
            if(map[this.items[this.selected]]) this.os.switchMode(map[this.items[this.selected]]);
        }
        if (e === 'BTN2') this.os.switchMode('home');
    }
}

class WorkoutMode extends Mode {
    constructor(os) { super(os); this.dist=0; }
    update(dt) { this.dist += 0.001; }
    draw(gfx) {
        // +------------------------------+
        // | Pace: 5:21/km                |
        // | HR: 142                      |
        // +------------------------------+

        gfx.text("Pace: 5:21/km", 5, 25, 20, "left", COLOR_ON);
        gfx.text(`HR: ${this.os.sensors.heartRate}`, 5, 50, 20, "left", COLOR_ON);
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

class StopwatchMode extends Mode {
    constructor(os) { super(os); this.t=0; this.run=false; }
    update(dt) { if(this.run) this.t += dt; }
    draw(gfx) {
        gfx.text("STOPWATCH", SCREEN_W/2, 18, 16, "center", COLOR_DIM);
        gfx.text((this.t/1000).toFixed(2), SCREEN_W/2, 45, 24, "center");
    }
    onInput(e, type) {
        if(type!=='click') return;
        if(e==='BTN1') this.run = !this.run;
        if(e==='BTN2') { this.run=false; this.t=0; this.os.switchMode('home'); }
    }
}

class InfoMode extends Mode {
    draw(gfx) {
        gfx.text("INFO v0.3", SCREEN_W/2, 20, 16, "center");
        gfx.text("BAT: 84%", SCREEN_W/2, 40, 16, "center");
        gfx.text("MEM: 64KB", SCREEN_W/2, 60, 16, "center");
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

class CompassMode extends Mode {
    draw(gfx) {
        const h = this.os.sensors.heading;
        gfx.text("COMPASS", SCREEN_W/2, 20, 16, "center");
        gfx.text(`${Math.floor(h)}°`, SCREEN_W/2, 45, 24, "center");
    }
    onInput(e,type) { if(e==='BTN2') this.os.switchMode('home'); }
}

// --- OS KERNEL ---

class WatchOS {
    constructor() {
        this.gfx = new Graphics('display');
        this.audio = new AudioController();
        this.sensors = new SimulatedSensors();
        this.modes = {
            home: new HomeMode(this),
            menu: new MenuMode(this),
            stopwatch: new StopwatchMode(this),
            workout: new WorkoutMode(this),
            info: new InfoMode(this),
            compass: new CompassMode(this)
        };
        this.currentMode = this.modes.home;
        this.inputState = { pressedKey: null, lastPressTime: 0 };
        this.initInput();
        this.loop();
    }

    switchMode(name) {
        if(this.modes[name]) {
            this.currentMode.exit();
            this.currentMode = this.modes[name];
            this.currentMode.enter();
            this.audio.beep();
        }
    }

    handleInput(key, action) {
        const now = Date.now();
        this.triggerAnim(key);

        if (action === 'down') {
            this.inputState.pressedKey = key;
            this.inputState.lastPressTime = now;
            if (key === 'ENTER') {
                 this.holdTimer = setTimeout(() => {
                     this.currentMode.onInput('ENTER', 'long_press');
                     this.inputState.pressedKey = null;
                 }, 500);
            }
        } else if (action === 'up') {
            clearTimeout(this.holdTimer);
            if (this.inputState.pressedKey === key) {
                this.currentMode.onInput(key, 'click');
            }
            this.inputState.pressedKey = null;
        } else if (action === 'rotate') {
            this.currentMode.onInput(key, 'rotate');
        }
    }

    triggerAnim(key) {
        const map = { 'Z': 'phy-btn1', 'X': 'phy-btn2', 'UP': 'phy-crown', 'DOWN': 'phy-crown', 'ENTER': 'phy-crown' };
        const el = document.getElementById(map[key]);
        if(el) {
            el.classList.add('active-btn');
            setTimeout(() => el.classList.remove('active-btn'), 100);
        }
    }

    initInput() {
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const map = { 'ArrowUp':'UP', 'ArrowDown':'DOWN', 'Enter':'ENTER', 'z':'BTN1', 'x':'BTN2', 'Z':'BTN1', 'X':'BTN2' };
            if (map[e.key]) this.handleInput(map[e.key], e.key.includes('Arrow') ? 'rotate' : 'down');
        });
        document.addEventListener('keyup', (e) => {
            const map = { 'Enter':'ENTER', 'z':'BTN1', 'x':'BTN2', 'Z':'BTN1', 'X':'BTN2' };
            if (map[e.key]) this.handleInput(map[e.key], 'up');
        });
    }

    loop() {
        this.currentMode.update(1000/FPS);
        this.gfx.clear();
        this.currentMode.draw(this.gfx);
        requestAnimationFrame(() => this.loop());
    }
}

window.onload = () => new WatchOS();
</script>
</body>
</html>
